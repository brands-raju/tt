SHOW CATALOGS;,SHOW SCHEMAS FROM mysql;
CREATE SCHEMA IF NOT EXISTS iceberg.university
WITH (location = 's3://warehouse/university/');
CREATE TABLE iceberg.university.courses (
    student_id INTEGER,
    course_name VARCHAR
);
INSERT INTO iceberg.university.courses VALUES
(101, 'Big Data Analytics'),
(102, 'Computer Science'),
(103, 'Machine Learning'),
(104, 'Data Science');
SELECT * FROM iceberg.university.courses;
SELECT
    s.student_id,
    s.student_name,
    s.department,
    c.course_name
FROM mysql.university.students s
JOIN iceberg.university.courses c
ON s.student_id = c.student_id;
EXIT;
docker compose up -d --force-recreate iceberg-rest
docker compose restart trino
docker exec iceberg_rest printenv AWS_REGION
docker logs iceberg_rest --tail 30
